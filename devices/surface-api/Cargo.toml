[package]
name = "surface-api"
version = "0.0.0"
description = "A device-neutral way to describe a MIDI control surface (pads, knobs, faders, buttons, a screen) and to drive its lights, for any host application"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Serialisable types, for drivers that run in another process or are loaded from a file.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
