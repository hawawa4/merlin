name: release

# Two ways to cut a release; both read the version from app/Cargo.toml:
#   1. Bump `version` in app/Cargo.toml, merge to main, then run this workflow from the
#      Actions tab. It creates the tag vX.Y.Z on that commit.
#   2. Push a tag yourself (git tag v0.2.0 && git push origin v0.2.0).
# The tag must match the version, and CI has to pass before anything is built or published.
#
# A release holds the .deb, a tarball with the amd64 Linux binaries (merlin, merlin-scan and
# merlin-bridge; the app looks for merlin-scan next to itself, so they go together) and SHA256SUMS.txt.
# The release called `runtime` (the Wine + yabridge archive the app downloads) is separate and
# published by hand with `just package-runtime`; see docs/wine.md.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' app/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Pushed tag $GITHUB_REF_NAME does not match the version in app/Cargo.toml (expected $tag)"
              exit 1
            fi
          else
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Run this workflow from main, not $GITHUB_REF_NAME"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::error::Tag $tag already exists. Bump the version in app/Cargo.toml first."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (Linux amd64)
    needs: [prepare, ci]
    # The oldest runner image keeps the glibc requirement of the binaries low.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxcb1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - run: cargo build --release -p merlin -p merlin-bridge

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dist
          cargo deb -p merlin --no-build --strip -o "dist/merlin_${VERSION}_amd64.deb"

          name="merlin-${VERSION}-linux-amd64"
          mkdir "$name"
          for b in merlin merlin-scan merlin-bridge; do
            strip -o "$name/$b" "target/release/$b"
          done
          cp LICENSE README.md "$name/"
          tar -czf "dist/$name.tar.gz" "$name"

          (cd dist && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          dpkg-deb -I "dist/merlin_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: dist
      - name: Create release (and tag, if it doesn't exist yet)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Merlin $VERSION" \
            --latest \
            --generate-notes

  site-image:
    name: Publish landing page image
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-site
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
      - uses: docker/build-push-action@v6
        with:
          context: site
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
