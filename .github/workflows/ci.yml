name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  crates:
    # The product crates only. The spikes need X11/Vulkan/Wine and are not built here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p 'merlin-*' --all-targets -- -D warnings
      - run: cargo test -p 'merlin-*'
