name: ci

on:
  push:
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  crates:
    # The product crates only (the app needs X11/Vulkan and Wine for some tests).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxcb1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p 'merlin-*' --all-targets -- -D warnings
      - run: cargo test -p 'merlin-*'

  site:
    name: Landing page (check, build, docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Check and build
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Docker image builds
        run: docker build -t merlin-site:ci site/
