name: ci

on:
  push:
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  crates:
    # The product crates only (the app needs X11/Vulkan and Wine for some tests).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxcb1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p 'merlin-*' --all-targets -- -D warnings
      - run: cargo test -p 'merlin-*'
