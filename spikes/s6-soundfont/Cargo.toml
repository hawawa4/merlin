[package]
name = "s6-soundfont"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
libloading.workspace = true
rustysynth.workspace = true
oxisynth = { version = "0.1", features = ["sf3"] }
rustysynth-ext = { version = "=1.5.0-alpha.1", features = ["sf3"] }
hound = "3.5"
# Build with RTSAN_ENABLE=1 RTSAN_LIB_PATH=/usr/lib/llvm-21/lib/clang/21/lib/linux/libclang_rt.rtsan-x86_64.a
rtsan-standalone = { version = "0.3", default-features = false }
