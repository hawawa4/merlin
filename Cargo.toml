[workspace]
resolver = "3"
members = ["spikes/*", "crates/*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1"
jack = "0.13"
rtrb = "0.4"
assert_no_alloc = "1.1"
libloading = "0.9"
rustysynth = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
base64 = "0.22"
toml = "0.9"

# Our own crates.
merlin-model = { path = "crates/model" }
merlin-hosting = { path = "crates/hosting" }
merlin-engine = { path = "crates/engine" }
merlin-audio-io = { path = "crates/audio-io" }
merlin-embed = { path = "crates/embed" }
merlin-scanner = { path = "crates/scanner" }

[profile.release]
debug = 1
