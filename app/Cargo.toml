[package]
name = "merlin"
version = "0.5.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A live instrument host for playing in real time: a rack of CLAP, VST3, VST2, LV2, SoundFont and Windows plugins, switched from MIDI controllers"
default-run = "merlin"

[[bin]]
name = "merlin"
path = "src/main.rs"

# Loads one plugin file in its own process and prints what is inside (see the scanner crate).
[[bin]]
name = "merlin-scan"
path = "src/bin/scan.rs"

# Runs one plugin in a process of its own (see the sandbox crate); the app starts one per plugin.
[[bin]]
name = "merlin-plugin-host"
path = "src/bin/plugin_host.rs"

# Device drivers (devices/): each can be left out of a build.
[features]
default = ["launchkey-mk3"]
launchkey-mk3 = ["dep:launchkey-mk3"]

[dependencies]
merlin-model.workspace = true
merlin-hosting.workspace = true
merlin-engine.workspace = true
merlin-audio-io.workspace = true
merlin-embed.workspace = true
merlin-scanner.workspace = true
merlin-sandbox.workspace = true
merlin-wine.workspace = true
merlin-control.workspace = true
merlin-backing.workspace = true
merlin-recorder.workspace = true
surface-api.workspace = true
launchkey-mk3 = { workspace = true, optional = true }
rtrb.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
libc = "0.2"
egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["x11"] }
egui-wgpu = { version = "0.37", default-features = false, features = ["winit"] }
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
wgpu = { version = "*", default-features = false, features = ["vulkan", "wgsl"] }
pollster = "0.4"

# `cargo deb -p merlin` (after `cargo build --release -p merlin -p merlin-bridge`): the .deb of the release workflow.
# merlin-scan and merlin-plugin-host have to sit next to merlin (the app looks for them there). JACK, X11 and Vulkan are loaded at runtime,
# so they are recommended rather than linked dependencies.
[package.metadata.deb]
name = "merlin"
maintainer = "Hawawa <me@hawawa.org>"
copyright = "Merlin contributors"
license-file = ["../LICENSE", "0"]
section = "sound"
priority = "optional"
depends = "$auto"
recommends = "pipewire-jack | libjack-jackd2-0, libvulkan1, libxcb1"
extended-description = "Merlin is a Linux-first live instrument host: a rack of instruments (CLAP, VST3, VST2, LV2, SoundFonts, and Windows plugins through a Wine + yabridge runtime the app downloads on request), each with simple built-in effects, switched from MIDI controllers."
assets = [
    ["target/release/merlin", "usr/bin/", "755"],
    ["target/release/merlin-scan", "usr/bin/", "755"],
    ["target/release/merlin-plugin-host", "usr/bin/", "755"],
    ["target/release/merlin-bridge", "usr/bin/", "755"],
    ["../packaging/merlin.desktop", "usr/share/applications/", "644"],
    ["../README.md", "usr/share/doc/merlin/README.md", "644"],
]
